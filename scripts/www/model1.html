<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小小粥 - 模特详情</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    body {
        background-color: #f0f2f5;
        padding: 15px;
    }
    /* 返回按钮 */
    .back-btn {
        display: inline-block;
        background: #fff;
        color: #333;
        padding: 8px 15px;
        border-radius: 8px;
        margin-bottom: 15px;
        box-shadow: 0 2px 8px #00000010;
        cursor: pointer;
        font-size: 14px;
    }
    /* 详情卡片 */
    .detail-card {
        background: #fff;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 4px 15px #00000010;
        max-width: 500px;
        margin: 0 auto;
    }

    /* ========== 多张轮播图样式 ========== */
    .swiper-box {
        width: 100%;
        overflow-x: auto; /* 横向滚动 */
        white-space: nowrap; /* 不换行 */
        scroll-snap-type: x mandatory; /* 吸附效果 */
        -webkit-overflow-scrolling: touch; /* 手机流畅滑动 */
    }
    /* 单张图片容器 9:16 */
    .swiper-item {
        display: inline-block;
        width: 100%;
        height: 0;
        padding-bottom: 177.78%;
        position: relative;
        scroll-snap-align: start;
    }
    /* 图片 */
    .swiper-item img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    /* 隐藏滚动条 */
    .swiper-box::-webkit-scrollbar {
        display: none;
    }

    /* 信息区域 */
    .info-box {
        padding: 25px 20px;
    }
    .model-name {
        font-size: 24px;
        font-weight: bold;
        color: #222;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eee;
    }
    .info-list {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-bottom: 20px;
    }
    .info-item {
        width: 45%;
        font-size: 15px;
        color: #555;
        line-height: 1.6;
    }
    .info-item span {
        font-weight: bold;
        color: #333;
    }
    /* 备注介绍 */
    .desc {
        color: #666;
        font-size: 14px;
        line-height: 1.7;
        padding-top: 15px;
        border-top: 1px solid #eee;
    }
</style>
</head>

<body>
<!-- 返回相册列表按钮 -->
<div class="back-btn" onclick="window.location.href='index.html'">← 返回相册</div>

<!-- 详情卡片 -->
<div class="detail-card">
    <!-- ========== 多张详情图（可无限添加） ========== -->
    <div class="swiper-box">
        <div class="swiper-item">
            <img src="images/模特1.jpg" alt="小小粥">
        </div>
        <div class="swiper-item">
            <img src="images/模特1-2.jpg" alt="小小粥详情图2">
        </div>
        <div class="swiper-item">
            <img src="images/模特1-3.jpg" alt="小小粥详情图3">
        </div>
        <div class="swiper-item">
            <img src="images/模特1-4.jpg" alt="小小粥详情图3">
        </div>
        <div class="swiper-item">
            <img src="images/模特1-5.jpg" alt="小小粥详情图3">
        </div>
    </div>

    <!-- 模特详细信息 -->
    <div class="info-box">
        <div class="model-name">小小粥</div>

        <div class="info-list">
            <div class="info-item"><span>身高：</span>166cm</div>
            <div class="info-item"><span>体重：</span>88斤</div>
            <div class="info-item"><span>三围：</span>70/60/80</div>
            <div class="info-item"><span>肩宽：</span>34cm</div>
            <div class="info-item"><span>鞋码：</span>37</div>
            <div class="info-item"><span>发色：</span>黑色</div>
        </div>

        <div class="desc">
            备注：形象甜美，镜头感强，适合拍摄写真、服装穿搭、短视频模特。
        </div>
    </div>
</div>

</body>
</html>
