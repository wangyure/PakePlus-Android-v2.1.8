<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兼职模特信息档案册</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    body {
        background-color: #f0f2f5;
        padding: 18px;
    }
    /* 顶部：左侧LOGO + 右侧标题 */
    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
    }
    .logo {
        width: 160px;
        height: 60px;
        object-fit: contain;
        background: transparent;
        border: none;
    }
    .title {
        font-size: 32px;
        color: #333;
        font-weight: bold;
    }
    .card-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 800px;
        margin: 0 auto;
    }
    /* 参考图灰色卡片样式 */
    .model-card {
        background: #c9c9c9;
        display: flex;
        align-items: center;
        padding: 12px;
        border: 2px solid white;
    }
    /* 左侧图片容器：四边均为5px白色描边 ✅ */
    .img-container {
        width: 180px;
        height: 280px;
        flex-shrink: 0;
        cursor: pointer;
        /* 核心：上下左右全部5px白色边框 */
        border-top: 5px solid white;
        border-bottom: 5px solid white;
        border-left: 5px solid white;
        border-right: 5px solid white;
        background: #f0f0f0;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    /* 照片完整显示，不裁剪、不变形 */
    .model-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }
    /* 右侧信息 */
    .model-info {
        flex: 1;
        padding: 0 24px;
    }
    .model-name {
        font-size: 36px;
        font-weight: bold;
        margin-bottom: 16px;
        color: #111;
    }
    .info-item {
        font-size: 24px;
        margin-bottom: 8px;
        color: #222;
    }
    .info-item span {
        font-weight: normal;
    }
</style>
</head>
<body>

<div class="header">
    <img src="./LOGO.png" class="logo" alt="LOGO">
    <h1 class="title">兼职模特信息档案册</h1>
</div>

<div class="card-container">

<!-- 模特1：小小粥 -->
<div class="model-card">
    <div class="img-container" onclick="window.location.href='model1.html'">
        <img src="images/模特1.jpg" class="model-img" alt="小小粥">
    </div>
    <div class="model-info">
        <div class="model-name">小小粥</div>
        <div class="info-item"><span>身高：</span>166cm</div>
        <div class="info-item"><span>体重：</span>100斤</div>
        <div class="info-item"><span>三围：</span>77/63/80</div>
        <div class="info-item"><span>肩宽：</span>34cm</div>
    </div>
</div>

<!-- 模特2：周佳盟 -->
<div class="model-card">
    <div class="img-container" onclick="window.location.href='model2.html'">
        <img src="images/模特2.jpg" class="model-img" alt="周佳盟">
    </div>
    <div class="model-info">
        <div class="model-name">周佳盟</div>
        <div class="info-item"><span>身高：</span>158cm</div>
        <div class="info-item"><span>体重：</span>87斤</div>
        <div class="info-item"><span>三围：</span>80/65/76</div>
        <div class="info-item"><span>肩宽：</span>35cm</div>
    </div>
</div>

<!-- 模特3：周鑫 -->
<div class="model-card">
    <div class="img-container" onclick="window.location.href='model3.html'">
        <img src="images/模特3.jpg" class="model-img" alt="周鑫">
    </div>
    <div class="model-info">
        <div class="model-name">周鑫</div>
        <div class="info-item"><span>身高：</span>158cm</div>
        <div class="info-item"><span>体重：</span>88斤</div>
        <div class="info-item"><span>三围：</span>70/60/80</div>
        <div class="info-item"><span>肩宽：</span>34cm</div>
    </div>
</div>

<!-- 模特4：小施 -->
<div class="model-card">
    <div class="img-container" onclick="window.location.href='model4.html'">
        <img src="images/模特4.jpg" class="model-img" alt="小施">
    </div>
    <div class="model-info">
        <div class="model-name">小施</div>
        <div class="info-item"><span>身高：</span>163cm</div>
        <div class="info-item"><span>体重：</span>90斤</div>
        <div class="info-item"><span>三围：</span>70/60/80</div>
        <div class="info-item"><span>肩宽：</span>34cm</div>
    </div>
</div>

</div>
</body>
</html>
