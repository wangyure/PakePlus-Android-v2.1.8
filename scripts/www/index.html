<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模特信息相册</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    body {
        background-color: #f0f2f5;
        padding: 15px;
    }
    .title {
        text-align: center;
        font-size: 24px;
        color: #333;
        margin-bottom: 20px;
        font-weight: bold;
    }
    .card-container {
        display: flex;
        flex-direction: column;
        gap: 15px;
        max-width: 600px;
        margin: 0 auto;
    }
    /* 横向卡片：左侧图片 + 右侧信息 */
    .model-card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 3px 10px #00000010;
        display: flex;
        align-items: center;
        height: 160px; /* 固定卡片高度 */
    }
    /* 左侧图片区域 9:16 */
    .img-container {
        width: 120px;
        height: 100%;
        position: relative;
        cursor: pointer;
    }
    .model-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    /* 右侧信息区域 */
    .model-info {
        flex: 1;
        padding: 15px 20px;
    }
    .model-name {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
        color: #222;
    }
    .info-item {
        font-size: 14px;
        margin-bottom: 5px;
        color: #555;
    }
    .info-item span {
        font-weight: bold;
        color: #333;
    }
</style>
</head>
<body>

<h1 class="title">模特信息档案册</h1>
<div class="card-container">

<!-- 模特1：小小粥 -->
<div class="model-card">
    <!-- 左侧9:16图片，点击跳转 -->
    <div class="img-container" onclick="window.location.href='model1.html'">
        <img src="images/模特1.jpg" class="model-img" alt="小小粥">
    </div>
    <!-- 右侧信息 -->
    <div class="model-info">
        <div class="model-name">小小粥</div>
        <div class="info-item"><span>身高：</span>166cm</div>
        <div class="info-item"><span>体重：</span>88斤</div>
        <div class="info-item"><span>三围：</span>70/60/80</div>
        <div class="info-item"><span>肩宽：</span>34cm</div>
    </div>
</div>

<!-- 模特2：周佳盟 -->
<div class="model-card">
    <div class="img-container" onclick="window.location.href='model2.html'">
        <img src="images/模特2.jpg" class="model-img" alt="周佳盟">
    </div>
    <div class="model-info">
        <div class="model-name">周佳盟</div>
        <div class="info-item"><span>身高：</span>158cm</div>
        <div class="info-item"><span>体重：</span>87斤</div>
        <div class="info-item"><span>三围：</span>80/65/76</div>
        <div class="info-item"><span>肩宽：</span>35cm</div>
    </div>
</div>

<!-- 模特3：周鑫 -->
<div class="model-card">
    <div class="img-container" onclick="window.location.href='model3.html'">
        <img src="images/模特3.jpg" class="model-img" alt="周鑫">
    </div>
    <div class="model-info">
        <div class="model-name">周鑫</div>
        <div class="info-item"><span>身高：</span>158cm</div>
        <div class="info-item"><span>体重：</span>88斤</div>
        <div class="info-item"><span>三围：</span>70/60/80</div>
        <div class="info-item"><span>肩宽：</span>34cm</div>
    </div>
</div>

<!-- 模特4：温冉 -->
<div class="model-card">
    <div class="img-container" onclick="window.location.href='model4.html'">
        <img src="images/模特4.jpg" class="model-img" alt="温冉">
    </div>
    <div class="model-info">
        <div class="model-name">温冉</div>
        <div class="info-item"><span>身高：</span>174cm</div>
        <div class="info-item"><span>体重：</span>50kg</div>
        <div class="info-item"><span>三围：</span>83/59/87</div>
    </div>
</div>

<!-- 直接复制上面的模块即可新增模特 -->

</div>
</body>
</html>
