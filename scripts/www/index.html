<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兼职模特信息档案册</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    body {
        background-color: #f4f5f7;
        padding: 16px;
    }

    /* 顶部区域：自适应布局 */
    .header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        gap: 12px;
    }
    .logo {
        width: clamp(120px, 25vw, 180px);
        height: auto;
        object-fit: contain;
    }
    .title {
        font-size: clamp(20px, 5vw, 32px);
        color: #333;
        font-weight: bold;
    }

    /* 卡片容器：自适应宽度 */
    .card-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 1000px;
        margin: 0 auto;
    }

    /* 模特卡片：参考图样式 + 自适应 */
    .model-card {
        background-color: #c0c0c0;
        border: 2px solid #ffffff;
        padding: 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 20px;
    }

    /* 图片容器：5px白色边框 + 自适应尺寸 */
    .img-container {
        width: clamp(120px, 30vw, 200px);
        height: clamp(180px, 50vw, 320px);
        flex-shrink: 0;
        border: 5px solid #ffffff;
        background-color: #f0f0f0;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }
    .model-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }

    /* 信息区域：自适应字号 */
    .model-info {
        flex: 1;
        min-width: 200px;
    }
    .model-name {
        font-size: clamp(24px, 6vw, 36px);
        font-weight: bold;
        color: #111;
        margin-bottom: 12px;
    }
    .info-item {
        font-size: clamp(16px, 4vw, 24px);
        color: #222;
        margin-bottom: 6px;
    }
    .info-item span {
        font-weight: normal;
    }

    /* 小屏优化：卡片垂直堆叠 */
    @media (max-width: 500px) {
        .model-card {
            flex-direction: column;
            align-items: flex-start;
        }
        .img-container {
            width: 100%;
            height: auto;
            aspect-ratio: 2/3;
        }
    }
</style>
</head>
<body>

<div class="header">
    <img src="./LOGO.png" class="logo" alt="TIANMEN GIRLS">
    <h1 class="title">兼职模特信息档案册</h1>
</div>

<div class="card-container">
    <!-- 模特1：小小粥 -->
    <div class="model-card">
        <div class="img-container" onclick="window.location.href='model1.html'">
            <img src="images/模特1.jpg" class="model-img" alt="小小粥">
        </div>
        <div class="model-info">
            <div class="model-name">小小粥</div>
            <div class="info-item"><span>身高：</span>166cm</div>
            <div class="info-item"><span>体重：</span>100斤</div>
            <div class="info-item"><span>三围：</span>77/63/80</div>
            <div class="info-item"><span>肩宽：</span>34cm</div>
        </div>
    </div>

    <!-- 模特2：周佳盟 -->
    <div class="model-card">
        <div class="img-container" onclick="window.location.href='model2.html'">
            <img src="images/模特2.jpg" class="model-img" alt="周佳盟">
        </div>
        <div class="model-info">
            <div class="model-name">周佳盟</div>
            <div class="info-item"><span>身高：</span>158cm</div>
            <div class="info-item"><span>体重：</span>87斤</div>
            <div class="info-item"><span>三围：</span>80/65/76</div>
            <div class="info-item"><span>肩宽：</span>35cm</div>
        </div>
    </div>

    <!-- 模特3：周鑫 -->
    <div class="model-card">
        <div class="img-container" onclick="window.location.href='model3.html'">
            <img src="images/模特3.jpg" class="model-img" alt="周鑫">
        </div>
        <div class="model-info">
            <div class="model-name">周鑫</div>
            <div class="info-item"><span>身高：</span>158cm</div>
            <div class="info-item"><span>体重：</span>88斤</div>
            <div class="info-item"><span>三围：</span>70/60/80</div>
            <div class="info-item"><span>肩宽：</span>34cm</div>
        </div>
    </div>

    <!-- 模特4：小施 -->
    <div class="model-card">
        <div class="img-container" onclick="window.location.href='model4.html'">
            <img src="images/模特4.jpg" class="model-img" alt="小施">
        </div>
        <div class="model-info">
            <div class="model-name">小施</div>
            <div class="info-item"><span>身高：</span>163cm</div>
            <div class="info-item"><span>体重：</span>90斤</div>
            <div class="info-item"><span>三围：</span>70/60/80</div>
            <div class="info-item"><span>肩宽：</span>34cm</div>
        </div>
    </div>
</div>

</body>
</html>
